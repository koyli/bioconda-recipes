{% set name = "fwdpy11" %}
{% set version = "0.24.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/fwdpy11-{{ version }}.tar.gz
  sha256: 586c1856839bd67df53a5d5cb124b1a3f9a15c2cb6831925497531447ed94522

build:
  number: 0
  skip: true  # [py < 311 or py >= 315]
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
  entry_points:
    - fwdpy11 = fwdpy11.__main__:main
  run_exports:
    - {{ pin_subpackage('fwdpy11', max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cbindgen
    - cmake
    - make
  host:
    - python
    - pip
    - setuptools-scm
    - pybind11 >=3.0
    - gsl
    - scikit-build-core >=0.11.0
    - numpy >=2.0
  run:
    - python
    - numpy >=1.23.5
    - tskit >=1.0.0
    - gsl
    - attrs >=20.3.0
    - demes >=0.2.2,<0.3
    - deprecated

test:
  imports:
    - fwdpy11
  commands:
    - fwdpy11 --help

about:
  home: https://github.com/molpopgen/fwdpy11
  license: "GPL-3.0-or-later"
  license_family: GPL3
  license_file: "COPYING"
  summary: 'Forward-time population genetic simulation in Python.'
  dev_url: https://github.com/molpopgen/fwdpy11
  doc_url: https://molpopgen.github.io/fwdpy11

extra:
  identifiers:
    - doi:10.1534/genetics.114.165019
    - doi:10.1371/journal.pcbi.1006581
  additional-platforms:
    - linux-aarch64
    - osx-arm64
